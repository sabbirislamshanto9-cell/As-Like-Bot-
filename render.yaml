services:
  - type: web
    name: as-like-bot-vip
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: BOHUDUR_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
